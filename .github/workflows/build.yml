name: Build and Release

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: NeoForge ${{ matrix.neoforge }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        neoforge: ["21.1.264"]
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Verify release automation
        run: python -m unittest discover -s .github/scripts -p "test_*.py"

      - name: Validate version and release notes
        id: version
        run: python .github/scripts/release.py check

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Java 25 for the Thaumaturge build tools
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Read pinned Thaumaturge revision
        id: thaumaturge
        run: |
          revision=$(sed -n 's/^thaumaturge_source_revision=//p' gradle.properties)
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Checkout Thaumaturge source
        uses: actions/checkout@v7
        with:
          repository: Leclowndu93150/Thaumaturge
          ref: ${{ steps.thaumaturge.outputs.revision }}
          path: .tools/thaumaturge-1.21.1
          persist-credentials: false

      - name: Build Thaumaturge dependency
        run: |
          chmod +x .tools/thaumaturge-1.21.1/gradlew
          .tools/thaumaturge-1.21.1/gradlew -p .tools/thaumaturge-1.21.1 --no-daemon runData --console=plain
          .tools/thaumaturge-1.21.1/gradlew -p .tools/thaumaturge-1.21.1 --no-daemon jar --console=plain
          mkdir -p libs
          find .tools/thaumaturge-1.21.1/build/libs -maxdepth 1 -name 'thaumaturge-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -exec cp {} libs/ \;

      - name: Build, package and run GameTests
        env:
          NEOFORGE_VERSION: ${{ matrix.neoforge }}
        run: ./gradlew --no-daemon build releaseArtifacts runGameTestServer "-Pneo_version=$NEOFORGE_VERSION" --console=plain

      - name: Upload release artifacts
        if: matrix.neoforge == '21.1.264'
        uses: actions/upload-artifact@v7
        with:
          name: kubethaum-${{ steps.version.outputs.version }}
          path: build/release/*
          if-no-files-found: error

      - name: Upload diagnostic logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs-neoforge-${{ matrix.neoforge }}
          path: |
            run-gametest/logs/
            run-gametest/kubejs/logs/
            run-gametest/crash-reports/
            build/reports/
          if-no-files-found: ignore

  release:
    name: Publish GitHub release
    needs: build
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
       github.ref == 'refs/heads/1.21.1' ||
       startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: kubethaum-release
      cancel-in-progress: false
    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download tested release artifacts
        uses: actions/download-artifact@v8
        with:
          name: kubethaum-${{ needs.build.outputs.version }}
          path: release

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Publish or replace this version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/release.py publish
