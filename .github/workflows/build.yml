name: Build and Release

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: NeoForge ${{ matrix.neoforge }} / KubeJS ${{ matrix.kubejs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - neoforge: "26.1.2.109"
            kubejs: { version: "8.0.6", modrinth: "FzLyIIBB" }
          - neoforge: "26.1.2.115"
            kubejs: { version: "8.0.6", modrinth: "FzLyIIBB" }
          - neoforge: "26.1.2.110"
            kubejs: { version: "8.0.7", modrinth: "7Vil8vwK" }
          - neoforge: "26.1.2.115"
            kubejs: { version: "8.0.7", modrinth: "7Vil8vwK" }
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Verify release automation
        run: python -m unittest discover -s .github/scripts -p "test_*.py"

      - name: Validate version and release notes
        id: version
        run: python .github/scripts/release.py check

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build, package and run GameTests
        env:
          NEOFORGE_VERSION: ${{ matrix.neoforge }}
          KUBEJS_MODRINTH_VERSION: ${{ matrix.kubejs.modrinth }}
        run: ./gradlew --no-daemon build releaseArtifacts runGameTestServer "-Pneo_version=$NEOFORGE_VERSION" "-Pkubejs_modrinth_version=$KUBEJS_MODRINTH_VERSION" --console=plain

      - name: Upload release artifacts
        if: matrix.neoforge == '26.1.2.115' && matrix.kubejs.version == '8.0.7'
        uses: actions/upload-artifact@v7
        with:
          name: kubethaum-${{ steps.version.outputs.version }}
          path: build/release/*
          if-no-files-found: error

      - name: Upload diagnostic logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs-neoforge-${{ matrix.neoforge }}-kubejs-${{ matrix.kubejs.version }}
          path: |
            run-gametest/logs/
            run-gametest/kubejs/logs/
            run-gametest/crash-reports/
            build/reports/
          if-no-files-found: ignore

  release:
    name: Publish GitHub release
    needs: build
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
       startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: kubethaum-release
      cancel-in-progress: false
    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download tested release artifacts
        uses: actions/download-artifact@v8
        with:
          name: kubethaum-${{ needs.build.outputs.version }}
          path: release

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Publish or replace this version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/release.py publish
