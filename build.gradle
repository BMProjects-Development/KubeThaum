plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id
base { archivesName = "${mod_id}-${minecraft_version}" }
java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

repositories {
    mavenCentral()
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven { url = 'https://cursemaven.com'; content { includeGroup 'curse.maven' } }
}

neoForge {
    version = neo_version
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = file('run-gametest')
            systemProperty 'kubethaum.smokeTest', 'true'
        }
        configureEach { logLevel = org.slf4j.event.Level.INFO }
    }
    mods {
        "${mod_id}" { sourceSet(sourceSets.main); sourceSet(sourceSets.test) }
    }
}

dependencies {
    // Optional offline development against an existing installation; never bundled in this jar.
    if (providers.gradleProperty('localModsDir').isPresent()) {
        implementation fileTree(providers.gradleProperty('localModsDir').get()) {
            include 'kubejs-*.jar', 'rhino-*.jar', 'thaumaturge-*.jar'
        }
        runtimeOnly fileTree(providers.gradleProperty('localModsDir').get()) {
            include 'curios-*.jar', 'lithostitched-*.jar', 'better-advanced-tooltips-*.jar'
        }
    } else {
        // Official release files, pinned by Modrinth version IDs.
        implementation("maven.modrinth:kubejs:${kubejs_modrinth_version}") { transitive = false }
        implementation("maven.modrinth:rhino:${rhino_modrinth_version}") { transitive = false }
        // TODO: change when Thaumaturge 1.21.1 uploads to curseforge
        // For now, it needs the .jar in /libs to run
        implementation fileTree('libs') { include 'thaumaturge-*.jar' }
        runtimeOnly 'curse.maven:curios-309927:6529130'
        runtimeOnly 'curse.maven:lithostitched-936015:9170709'
        runtimeOnly 'curse.maven:better-advanced-tooltips-1637623:8576077'
    }
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def propertiesToExpand = [minecraft_version_range: minecraft_version_range,
        neo_version_range: neo_version_range, mod_id: mod_id, mod_name: mod_name,
        mod_license: mod_license, mod_version: mod_version, mod_authors: mod_authors,
        mod_description: mod_description]
    inputs.properties propertiesToExpand
    expand propertiesToExpand
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

tasks.register('verifyResearch', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.bmp.kubethaum.ResearchVerification'
    enableAssertions = true
}
tasks.register('verifyScriptCheck', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.bmp.kubethaum.ScriptCheckVerification'
    enableAssertions = true
}
def releaseNotes = layout.projectDirectory.file("changelogs/${mod_version}.md")
tasks.register('verifyReleaseNotes') {
    doLast {
        def notes = releaseNotes.asFile
        if (!notes.isFile() || notes.getText('UTF-8').trim().isEmpty()) {
            throw new GradleException("Add release notes in ${notes.name} under changelogs/")
        }
    }
}

tasks.named('check') { dependsOn 'verifyResearch', 'verifyScriptCheck', 'verifyReleaseNotes' }
tasks.named('test') { enabled = false } // Checks use verifyResearch and the actual GameTest server.

def prepareSmokeScripts = tasks.register('prepareSmokeScripts', Copy) {
    from('examples/server_scripts')
    from('examples/standalone') { include '**/server_scripts/*.js'; eachFile { path = name }; includeEmptyDirs = false }
    from('src/test/scripts')
    into('run-gametest/kubejs/server_scripts')
}

tasks.register('releaseZip', Zip) {
    dependsOn tasks.named('jar'), tasks.named('verifyReleaseNotes')
    archiveFileName = "KubeThaum-${mod_version}.zip"
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from(tasks.named('jar')) { into 'mods' }
    from('examples') { into 'examples' }
    from('README.md')
    from('changelogs') { into 'changelogs' }
    from('docs') { into 'docs' }
}

// Stage only this version's deliverables, even when build/libs contains older builds.
tasks.register('releaseArtifacts', Sync) {
    from tasks.named('jar'), tasks.named('sourcesJar'), tasks.named('releaseZip')
    into layout.buildDirectory.dir('release')
}
tasks.matching { it.name == 'prepareGameTestServerRun' }.configureEach {
    dependsOn prepareSmokeScripts
}
