modLoader="javafml"
loaderVersion="[11,)"
license="${mod_license}"
issueTrackerURL="https://github.com/BMProjects-Development/KubeThaum/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/BMProjects-Development/KubeThaum"
authors="${mod_authors}"
description='''${mod_description}'''

[[mixins]]
config="kubethaum.mixins.json"

[[dependencies.kubethaum]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.kubethaum]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.kubethaum]]
modId="kubejs"
type="required"
versionRange="[26.1.2-8.0.6]"
ordering="AFTER"
side="BOTH"

[[dependencies.kubethaum]]
modId="thaumaturge"
type="required"
versionRange="[1.0.2,1.1)"
ordering="AFTER"
side="BOTH"
